<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 580" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Sparkify Music Analytics: ETL and Cassandra data modeling">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect width="1500" height="580" fill="#ffffff"/>
<text x="750.0" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Sparkify Music Analytics — ETL and Cassandra Data Modeling</text>
<rect x="830" y="66" width="430" height="466" rx="12" fill="none" stroke="#6b7280" stroke-dasharray="6 5"/>
<text x="120" y="120" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#4b5563">RAW DATA</text>
<text x="395" y="120" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#4b5563">TRANSFORM</text>
<text x="670" y="120" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#4b5563">PROCESSED</text>
<text x="1045" y="56" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#4b5563">APACHE CASSANDRA · KEYSPACE sparkify</text>
<text x="1385" y="56" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#4b5563">ANALYTICAL QUERIES</text>
<line x1="220" y1="275.0" x2="268" y2="275.0" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="520" y1="275.0" x2="568" y2="275.0" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M770,275.0 H810.0 V157.5 H848" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M770,275.0 H810.0 V302.5 H848" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M770,275.0 H810.0 V447.5 H848" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1240" y1="157.5" x2="1298" y2="157.5" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1240" y1="302.5" x2="1298" y2="302.5" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1240" y1="447.5" x2="1298" y2="447.5" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="215" width="200" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="32" y="241" font-size="15" font-weight="700" fill="#1f2937">Sparkify Event Logs</text>
<text x="32" y="265" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2937" xml:space="preserve">data/raw/</text>
<text x="32" y="286" font-size="13" fill="#4b5563" xml:space="preserve">30 daily CSV files</text>
<text x="32" y="307" font-size="13" fill="#4b5563" xml:space="preserve">November 2018</text>
<rect x="270" y="150" width="250" height="250" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="282" y="176" font-size="15" font-weight="700" fill="#1f2937">Python ETL</text>
<text x="282" y="200" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2937" xml:space="preserve">src/preprocessing.py</text>
<text x="282" y="221" font-size="13" fill="#4b5563" xml:space="preserve">1. Discover daily files (sorted)</text>
<text x="282" y="242" font-size="13" fill="#4b5563" xml:space="preserve">2. Read events</text>
<text x="282" y="263" font-size="13" fill="#4b5563" xml:space="preserve">3. Exclude non-playback rows</text>
<text x="282" y="284" font-size="13" fill="#4b5563" xml:space="preserve">   (no artist)</text>
<text x="282" y="305" font-size="13" fill="#4b5563" xml:space="preserve">4. Select 11 columns by name</text>
<text x="282" y="326" font-size="13" fill="#4b5563" xml:space="preserve">5. Write consolidated CSV</text>
<rect x="570" y="215" width="200" height="120" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="582" y="241" font-size="15" font-weight="700" fill="#1f2937">Processed Data</text>
<text x="582" y="265" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2937" xml:space="preserve">data/processed/</text>
<text x="582" y="286" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2937" xml:space="preserve">event_datafile_new.csv</text>
<text x="582" y="307" font-size="13" fill="#4b5563" xml:space="preserve">6,820 playback events</text>
<text x="582" y="328" font-size="13" fill="#4b5563" xml:space="preserve">11 columns</text>
<rect x="850" y="95" width="390" height="125" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="862" y="121" font-size="15" font-weight="700" fill="#1f2937">Table 1: song_by_session_item</text>
<text x="862" y="145" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1f2937" xml:space="preserve">PRIMARY KEY (session_id, item_in_session)</text>
<text x="862" y="166" font-size="13" fill="#4b5563" xml:space="preserve">Partition key: session_id</text>
<text x="862" y="187" font-size="13" fill="#4b5563" xml:space="preserve">Clustering column: item_in_session</text>
<text x="862" y="208" font-size="13" fill="#4b5563" xml:space="preserve">One row per play in a session</text>
<rect x="850" y="240" width="390" height="125" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="862" y="266" font-size="15" font-weight="700" fill="#1f2937">Table 2: song_by_user_session</text>
<text x="862" y="290" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1f2937" xml:space="preserve">PRIMARY KEY ((user_id, session_id), item_in_session)</text>
<text x="862" y="311" font-size="13" fill="#4b5563" xml:space="preserve">Partition key: (user_id, session_id)</text>
<text x="862" y="332" font-size="13" fill="#4b5563" xml:space="preserve">Clustering column: item_in_session ASC</text>
<text x="862" y="353" font-size="13" fill="#4b5563" xml:space="preserve">One user's session history, in order</text>
<rect x="850" y="385" width="390" height="125" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="862" y="411" font-size="15" font-weight="700" fill="#1f2937">Table 3: listeners_by_song</text>
<text x="862" y="435" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1f2937" xml:space="preserve">PRIMARY KEY (song, user_id)</text>
<text x="862" y="456" font-size="13" fill="#4b5563" xml:space="preserve">Partition key: song</text>
<text x="862" y="477" font-size="13" fill="#4b5563" xml:space="preserve">Clustering column: user_id</text>
<text x="862" y="498" font-size="13" fill="#4b5563" xml:space="preserve">One row per distinct listener of a song</text>
<rect x="1300" y="95" width="170" height="125" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="1312" y="121" font-size="15" font-weight="700" fill="#1f2937">Query 1</text>
<text x="1312" y="145" font-size="13" fill="#4b5563" xml:space="preserve">session 338,</text>
<text x="1312" y="166" font-size="13" fill="#4b5563" xml:space="preserve">item 4</text>
<text x="1312" y="187" font-size="13" fill="#4b5563" xml:space="preserve">→ artist, song,</text>
<text x="1312" y="208" font-size="13" fill="#4b5563" xml:space="preserve">length</text>
<rect x="1300" y="240" width="170" height="125" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="1312" y="266" font-size="15" font-weight="700" fill="#1f2937">Query 2</text>
<text x="1312" y="290" font-size="13" fill="#4b5563" xml:space="preserve">user 10,</text>
<text x="1312" y="311" font-size="13" fill="#4b5563" xml:space="preserve">session 182</text>
<text x="1312" y="332" font-size="13" fill="#4b5563" xml:space="preserve">→ artist, song,</text>
<text x="1312" y="353" font-size="13" fill="#4b5563" xml:space="preserve">name, in order</text>
<rect x="1300" y="385" width="170" height="125" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="1312" y="411" font-size="15" font-weight="700" fill="#1f2937">Query 3</text>
<text x="1312" y="435" font-size="13" fill="#4b5563" xml:space="preserve">song 'All Hands</text>
<text x="1312" y="456" font-size="13" fill="#4b5563" xml:space="preserve">Against His Own'</text>
<text x="1312" y="477" font-size="13" fill="#4b5563" xml:space="preserve">→ listener</text>
<text x="1312" y="498" font-size="13" fill="#4b5563" xml:space="preserve">names</text>
</svg>